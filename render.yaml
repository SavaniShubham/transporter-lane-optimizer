services:
  - type: web
    name: transporter-lane-optimizer
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: optimizer-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: optimizer-db
    plan: free
    databaseName: optimizer_db


