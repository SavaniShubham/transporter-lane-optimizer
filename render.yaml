services:
  - type: web
    name: freightfox-lane-optimizer
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freightfox-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: freightfox-db
    plan: free
    databaseName: freightfox

